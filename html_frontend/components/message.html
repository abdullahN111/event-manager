<div
  id="messageToast"
  class="fixed top-5 right-5 z-[9999] hidden w-full max-w-sm"
>
  <div
    id="messageToastContent"
    class="flex items-start gap-3 rounded-lg border bg-white p-4 shadow-lg"
  >
    <div id="messageToastIcon" class="text-xl"></div>

    <div class="flex-1">
      <p id="messageToastTitle" class="font-semibold text-gray-800"></p>
      <p id="messageToastText" class="mt-1 text-sm text-gray-600"></p>
    </div>

    <button
      id="messageToastClose"
      type="button"
      class="text-gray-400 hover:text-gray-600"
    >
      &times;
    </button>
  </div>
</div>
