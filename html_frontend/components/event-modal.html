<div
  id="eventModal"
  class="hidden fixed inset-0 bg-black/40 flex items-start justify-center z-50 pt-6 pb-6 px-4 overflow-y-auto"
>
  <div
    class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[calc(100vh-3rem)] overflow-y-auto"
  >
    <div
      class="sticky top-0 z-10 flex justify-between items-center px-6 py-4 bg-white/95 backdrop-blur border-b border-gray-100"
    >
      <div>
        <h2 class="text-xl font-bold text-gray-800">Create New Event</h2>
        <p class="text-sm text-gray-500 mt-0.5">
          Enter the booking, customer, and payment details below.
        </p>
      </div>

      <button
        type="button"
        id="closeModalBtn"
        class="w-9 h-9 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-all duration-200 cursor-pointer"
        aria-label="Close modal"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <form id="eventForm" class="p-6 space-y-6">
      <!-- Event Details -->
      <div class="pb-5 border-b border-gray-100">
        <h3
          class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2"
        >
          <span class="w-1.5 h-5 bg-theme rounded-full"></span>
          Event Details
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Event Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              name="eventName"
              id="eventName"
              placeholder="e.g., Ali & Sara Walima"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Status <span class="text-red-500">*</span>
            </label>
            <select
              name="status"
              id="status"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            >
              <option value="Upcoming">Upcoming</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Event Date <span class="text-red-500">*</span>
            </label>
            <input
              type="date"
              name="eventDate"
              id="eventDate"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Booking Date <span class="text-red-500">*</span>
            </label>
            <input
              type="date"
              name="bookingDate"
              id="bookingDate"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Start Time <span class="text-red-500">*</span>
            </label>
            <input
              type="time"
              name="startTime"
              id="startTime"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              End Time <span class="text-red-500">*</span>
            </label>
            <input
              type="time"
              name="endTime"
              id="endTime"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
        </div>

        <div
          id="availabilityFeedback"
          class="hidden mt-3 px-3 py-2 rounded-lg text-xs font-medium"
        ></div>

        <div class="mt-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Description / Notes (Optional)
          </label>
          <textarea
            name="description"
            id="description"
            rows="2"
            placeholder="Number of guests, menu package, stage setup, or special instructions..."
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme resize-none"
          ></textarea>
        </div>
      </div>

      <!-- Customer Details -->
      <div class="pb-5 border-b border-gray-100">
        <h3
          class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2"
        >
          <span class="w-1.5 h-5 bg-theme rounded-full"></span>
          Customer Details
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Customer Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              name="customerName"
              id="customerName"
              placeholder="e.g., Muhammad Tariq"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Phone Number <span class="text-red-500">*</span>
            </label>
            <input
              type="tel"
              name="customerPhone"
              id="customerPhone"
              placeholder="e.g., 0300-1234567"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Email Address <span class="text-gray-400 font-normal">(Optional)</span>
            </label>
            <input
              type="email"
              name="customerEmail"
              id="customerEmail"
              placeholder="customer@example.com (leave blank if none)"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
            />
          </div>
        </div>
      </div>

      <!-- Financial Details -->
      <div class="pb-4">
        <h3
          class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2"
        >
          <span class="w-1.5 h-5 bg-theme rounded-full"></span>
          Financial Details
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Total Amount (Rs.) <span class="text-red-500">*</span>
            </label>
            <input
              type="number"
              name="requestedAmount"
              id="requestedAmount"
              min="0"
              placeholder="0"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Advance / Paid (Rs.) <span class="text-red-500">*</span>
            </label>
            <input
              type="number"
              name="totalPaid"
              id="totalPaid"
              min="0"
              placeholder="0"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Remaining Balance (Rs.)
            </label>
            <input
              type="number"
              name="confirmedAmount"
              id="confirmedAmount"
              placeholder="0"
              class="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-lg text-sm font-semibold text-gray-700 outline-none"
              readonly
            />
          </div>
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Booked By (Manager / Staff Name) <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            name="bookingBy"
            id="bookingBy"
            placeholder="e.g., Manager"
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 transition-all duration-200 focus:bg-white input-theme"
            required
          />
        </div>
      </div>

      <!-- Modal Footer Actions -->
      <div
        class="sticky bottom-0 -mx-6 -mb-6 mt-2 px-6 py-4 bg-white/95 backdrop-blur border-t border-gray-100 flex justify-end gap-3"
      >
        <button
          type="button"
          id="cancelModalBtn"
          class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-all duration-200 cursor-pointer"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="px-5 py-2.5 text-sm font-medium btn-theme rounded-lg shadow-sm cursor-pointer"
        >
          Save Booking
        </button>
      </div>
    </form>
  </div>
</div>
