<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/theme.css" />
    <title>Edit Event – Events Manager</title>
  </head>

  <body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1 container mx-auto px-4 py-6 max-w-4xl">
      <div class="mb-6 flex justify-between items-center">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold text-gray-800">
            Edit Event Booking
          </h1>
          <p class="text-sm text-gray-600">
            Update the schedule, customer info, or payment balance for this booking.
          </p>
        </div>
        <a
          href="events.html"
          class="px-4 py-2 text-sm font-medium bg-white border border-gray-200 text-gray-700 rounded-lg hover:bg-gray-50"
        >
          &larr; Back
        </a>
      </div>

      <div
        id="loadingMessage"
        class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center text-gray-500"
      >
        Loading event details...
      </div>

      <form
        id="editEventForm"
        class="hidden bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6"
      >
        <!-- Event Details -->
        <section class="pb-5 border-b border-gray-100">
          <h2
            class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2"
          >
            <span class="w-1.5 h-5 bg-theme rounded-full"></span>
            Event Details
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Event Name <span class="text-red-500">*</span>
              </label>

              <input
                type="text"
                id="edit_eventName"
                name="eventName"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Status <span class="text-red-500">*</span>
              </label>

              <select
                id="edit_status"
                name="status"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              >
                <option value="Upcoming">Upcoming</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Event Date <span class="text-red-500">*</span>
              </label>

              <input
                type="date"
                id="edit_eventDate"
                name="eventDate"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Booking Date <span class="text-red-500">*</span>
              </label>

              <input
                type="date"
                id="edit_bookingDate"
                name="bookingDate"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Start Time <span class="text-red-500">*</span>
              </label>

              <input
                type="time"
                id="edit_startTime"
                name="startTime"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                End Time <span class="text-red-500">*</span>
              </label>

              <input
                type="time"
                id="edit_endTime"
                name="endTime"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Description / Notes (Optional)
            </label>

            <textarea
              id="edit_description"
              name="description"
              rows="3"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
            ></textarea>
          </div>
        </section>

        <!-- Customer Details -->
        <section class="pb-5 border-b border-gray-100">
          <h2
            class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2"
          >
            <span class="w-1.5 h-5 bg-theme rounded-full"></span>
            Customer Details
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Customer Name <span class="text-red-500">*</span>
              </label>

              <input
                type="text"
                id="edit_customerName"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Phone Number <span class="text-red-500">*</span>
              </label>

              <input
                type="tel"
                id="edit_customerPhone"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>

            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Email Address
                <span class="text-gray-400 font-normal">(Optional)</span>
              </label>

              <input
                type="email"
                id="edit_customerEmail"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>
          </div>
        </section>

        <!-- Financial Details -->
        <section>
          <h2
            class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2"
          >
            <span class="w-1.5 h-5 bg-theme rounded-full"></span>
            Financial Details
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Total Amount (Rs.) <span class="text-red-500">*</span>
              </label>

              <input
                type="number"
                id="edit_requestedAmount"
                required
                min="0"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Total Paid (Rs.) <span class="text-red-500">*</span>
              </label>

              <input
                type="number"
                id="edit_totalPaid"
                required
                min="0"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Remaining Balance (Rs.)
              </label>

              <input
                type="number"
                id="edit_confirmedAmount"
                readonly
                class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 font-semibold text-gray-700"
              />
            </div>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Booking By <span class="text-red-500">*</span>
            </label>

            <input
              type="text"
              id="edit_bookingBy"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg input-theme"
            />
          </div>
        </section>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
          <a
            href="events.html"
            class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium text-sm"
          >
            Cancel
          </a>

          <button
            type="submit"
            class="px-5 py-2 btn-theme rounded-lg font-medium text-sm cursor-pointer"
          >
            Save Changes
          </button>
        </div>
      </form>
    </main>

    <div id="footer"></div>
    <div id="eventModalContainer"></div>
    <div id="messageContainer"></div>

    <script src="js/components.js"></script>
    <script src="js/message.js"></script>
    <script src="js/event-modal.js"></script>
    <script src="js/edit-event.js"></script>
  </body>
</html>
