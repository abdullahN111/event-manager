<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="assets/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Edit Event</title>
  </head>

  <body class="bg-gray-50">
    <div id="header"></div>

    <main class="container mx-auto px-4 py-6">
      <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Edit Event</h1>

        <p class="text-gray-600">Update the details of this upcoming event.</p>
      </div>

      <div
        id="loadingMessage"
        class="bg-white rounded-lg shadow-md p-6 text-center text-gray-500"
      >
        Loading event...
      </div>

      <form
        id="editEventForm"
        class="hidden bg-white rounded-lg shadow-md p-6 space-y-6"
      >
        <!-- Event Details -->
        <section>
          <h2 class="text-lg font-semibold text-gray-800 mb-4">
            Event Details
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Event Name
              </label>

              <input
                type="text"
                id="eventName"
                name="eventName"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Status
              </label>

              <select
                id="status"
                name="status"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              >
                <option value="Upcoming">Upcoming</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Event Date
              </label>

              <input
                type="date"
                id="eventDate"
                name="eventDate"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Booking Date
              </label>

              <input
                type="date"
                id="bookingDate"
                name="bookingDate"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Start Time
              </label>

              <input
                type="time"
                id="startTime"
                name="startTime"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                End Time
              </label>

              <input
                type="time"
                id="endTime"
                name="endTime"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Description
            </label>

            <textarea
              id="description"
              name="description"
              rows="3"
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
            ></textarea>
          </div>
        </section>

        <!-- Customer Details -->
        <section>
          <h2 class="text-lg font-semibold text-gray-800 mb-4">
            Customer Details
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Customer Name
              </label>

              <input
                type="text"
                id="customerName"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Email
              </label>

              <input
                type="email"
                id="customerEmail"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>

            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Phone
              </label>

              <input
                type="tel"
                id="customerPhone"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>
          </div>
        </section>

        <!-- Financial Details -->
        <section>
          <h2 class="text-lg font-semibold text-gray-800 mb-4">
            Financial Details
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Total Amount (Rs.)
              </label>

              <input
                type="number"
                id="requestedAmount"
                required
                min="0"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Total Paid (Rs.)
              </label>

              <input
                type="number"
                id="totalPaid"
                required
                min="0"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Remaining Amount (Rs.)
              </label>

              <input
                type="number"
                id="confirmedAmount"
                readonly
                class="w-full px-4 py-2 border border-gray-300 rounded-md bg-gray-100"
              />
            </div>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Booking By
            </label>

            <input
              type="text"
              id="bookingBy"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
            />
          </div>
        </section>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 pt-4 border-t">
          <a
            href="events.html"
            class="px-4 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200"
          >
            Back
          </a>

          <button
            type="submit"
            class="px-5 py-2 bg-[#e91e63] text-white rounded-md hover:bg-[#d81b60]"
          >
            Save Changes
          </button>
        </div>
      </form>
    </main>

    <div id="footer"></div>
    <div id="messageContainer"></div>

    <script src="js/components.js"></script>
    <script src="js/message.js"></script>
    <script src="js/edit-event.js"></script>
  </body>
</html>
