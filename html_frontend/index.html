<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Home</title>
  </head>

  <body>
    <div id="header"></div>
    <main class="container mx-auto p-4">
      <div class="mb-4">
        <h1 class="text-2xl font-bold text-gray-800">
          Welcome, Admin – Hall Dashboard
        </h1>
      </div>

      <section class="bg-white rounded-lg shadow-md p-4">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold text-gray-800">Calendar Overview</h2>

          <div class="flex items-center space-x-2">
            <button id="prevMonth" class="p-2 rounded-full hover:bg-gray-100">
              ◀
            </button>

            <span
              id="monthYear"
              class="text-lg font-medium text-gray-700 w-36 text-center"
            ></span>

            <button id="nextMonth" class="p-2 rounded-full hover:bg-gray-100">
              ▶
            </button>
          </div>
        </div>

        <div id="weekdays" class="grid grid-cols-7 gap-2 mb-2"></div>

        <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
      </section>

      <div
        id="datePopover"
        class="hidden absolute z-50 bg-white border rounded-lg shadow-xl p-4 w-80"
      ></div>

      <section class="bg-white rounded-lg shadow-md py-6 px-4 mt-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold text-gray-800">Upcoming Events</h2>

          <a href="events.html" class="text-[#e91e63] hover:underline">
            View All Events
          </a>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead>
              <tr>
                <th
                  class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                >
                  Event Name
                </th>
                <th
                  class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                >
                  Customer
                </th>
                <th
                  class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                >
                  Phone
                </th>
                <th
                  class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                >
                  Date
                </th>
                <th
                  class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                >
                  Time
                </th>
                <th
                  class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                >
                  Event Status
                </th>
                <th
                  class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                >
                  Payment Status
                </th>
                <th
                  class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
                >
                  Action
                </th>
              </tr>
            </thead>

            <tbody
              id="upcomingEventsBody"
              class="bg-white divide-y divide-gray-200"
            ></tbody>
          </table>
        </div>
      </section>

      <div id="selectedEvents" class="mt-6"></div>
    </main>
    <button
      class="newEventBtn fixed right-8 bottom-12 z-50 flex items-center justify-center bg-[#e91e63] text-white p-4 rounded-full shadow-lg hover:bg-[#d81b60] transition-all duration-300 hover:shadow-xl transform hover:scale-105 cursor-pointer"
      aria-label="Create new event"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 mr-1"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 6v6m0 0v6m0-6h6m-6 0H6"
        />
      </svg>
      <span class="hidden md:inline ml-2 font-medium">New Event</span>
    </button>

    <div
      id="cancelModal"
      class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-xl shadow-lg p-6 w-80 text-center">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Confirm Cancel</h2>

        <p class="text-sm text-gray-600 mb-6">
          Are you sure you want to cancel this event? This action cannot be
          undone.
        </p>

        <div class="flex justify-center gap-3">
          <button
            id="cancelBackBtn"
            class="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200"
          >
            Back
          </button>

          <button
            id="confirmCancelBtn"
            class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700"
          >
            Confirm Cancel
          </button>
        </div>
      </div>
    </div>
    <div id="footer"></div>
    <div id="eventModalContainer"></div>
    <div id="messageContainer"></div>

    <script src="js/components.js"></script>
    <script src="js/message.js"></script>
    <script src="js/event-modal.js"></script>
    <script src="js/poopover.js"></script>
    <script src="js/calender.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
