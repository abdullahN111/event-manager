<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/theme.css" />
    <title>Event Details – Events Manager</title>

    <style>
      @media print {
        body {
          background: white !important;
        }

        header,
        footer,
        #eventModal,
        #cancelModal,
        .no-print,
        button,
        a[href*="edit-event"],
        a[href*="events.html"] {
          display: none !important;
        }

        #printArea {
          display: block !important;
          width: 100%;
        }

        body * {
          visibility: hidden;
        }

        #printArea,
        #printArea * {
          visibility: visible;
        }

        #printArea {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
      }
    </style>
  </head>

  <body class="bg-theme-gradient min-h-screen flex flex-col">
    <div id="header"></div>
    <main class="flex-1">
      <div id="printArea">
        <div id="eventContainer" class="py-10 px-4 sm:px-6">
          <p class="text-center text-gray-500 font-medium mt-10">
            Loading event details...
          </p>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <div
      id="cancelModal"
      class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4"
    >
      <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-sm text-center">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Confirm Cancel</h2>

        <p class="text-sm text-gray-600 mb-6">
          Are you sure you want to cancel this event? This action cannot be
          undone.
        </p>

        <div class="flex justify-center gap-3">
          <button
            id="cancelBackBtn"
            type="button"
            class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 cursor-pointer"
          >
            Back
          </button>

          <button
            id="confirmCancelBtn"
            type="button"
            class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 cursor-pointer"
          >
            Confirm Cancel
          </button>
        </div>
      </div>
    </div>
    <div id="eventModalContainer"></div>
    <div id="messageContainer"></div>

    <script src="js/components.js"></script>
    <script src="js/message.js"></script>
    <script src="js/event-modal.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/events.js"></script>
  </body>
</html>
