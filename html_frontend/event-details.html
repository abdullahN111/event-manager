<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Event Details</title>

    <style>
      @media print {
        body {
          background: white !important;
        }

        header,
        footer,
        #eventModal,
        #profileMenu,
        button,
        a[href*="edit-event"] {
          display: none !important;
        }

        #printArea {
          display: block !important;
          width: 100%;
        }

        body * {
          visibility: hidden;
        }

        #printArea,
        #printArea * {
          visibility: visible;
        }

        #printArea {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-br from-pink-50 via-white to-pink-100 min-h-screen"
  >
    <div id="header"></div>
    <main>
      <div id="printArea">
        <div id="eventContainer" class="py-12 px-6">
          <p class="text-center text-gray-500 font-medium mt-10">Loading...</p>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <div
      id="cancelModal"
      class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-xl shadow-lg p-6 w-80 text-center">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Confirm Cancel</h2>

        <p class="text-sm text-gray-600 mb-6">
          Are you sure you want to cancel this event? This action cannot be
          undone.
        </p>

        <div class="flex justify-center gap-3">
          <button
            id="cancelBackBtn"
            class="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200"
          >
            Back
          </button>

          <button
            id="confirmCancelBtn"
            class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700"
          >
            Confirm Cancel
          </button>
        </div>
      </div>
    </div>
    <div id="eventModalContainer"></div>
    <div id="messageContainer"></div>

    <script src="js/components.js"></script>
    <script src="js/message.js"></script>
    <script src="js/event-modal.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/events.js"></script>
  </body>
</html>
