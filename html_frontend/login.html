<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Login</title>
  </head>

  <body class="bg-gray-50">
    <div class="flex h-screen">
      <div class="hidden md:block md:w-1/2">
        <img src="assets/banquet.png" class="object-cover w-full h-full" />
      </div>

      <div
        class="flex flex-col justify-center items-center w-full md:w-1/2 px-8"
      >
        <div class="w-full max-w-md">
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">Events Manager</h1>

            <p class="text-gray-600 mt-2">Administrator Portal</p>
          </div>

          <form id="loginForm" class="bg-white p-8 rounded-lg shadow-md">
            <div class="mb-4">
              <label
                for="email"
                class="block text-gray-700 text-sm font-medium mb-2"
              >
                Email Address
              </label>
              <input
                type="email"
                id="email"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="mb-6">
              <div class="flex justify-between items-center mb-2">
                <label
                  for="password"
                  class="block text-gray-700 text-sm font-medium"
                >
                  Password
                </label>
              </div>
              <input
                type="password"
                id="password"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#e91e63]"
                placeholder="Enter your password"
                required
              />
            </div>

            <button
              id="loginBtn"
              type="submit"
              class="w-full bg-[#e91e63] text-white py-2 px-4 rounded-md hover:bg-[#d81b60] focus:outline-none focus:ring-2 focus:ring-[#e91e63] focus:ring-opacity-50 transition-colors cursor-pointer"
            >
              Sign In
            </button>

            <p id="message"></p>
          </form>
        </div>
      </div>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
